name: KLINK Live RAG Smoke Tests

on:
  push:
    branches:
      - feat/live-rag-chat-20261106
      - feat/personalized-benefits-20261107
      - feat/final-uiux-20261107
      - feat/hr-domain-priorities-20261107
      - feat/hr-answer-quality-20261107
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - name: Install backend dependencies
        run: python -m pip install -r server/requirements-dev.txt
      - name: Test real SSE and PDF ingestion (no paid API calls)
        env:
          KLINK_DEMO_PASSWORD: ci-only-password
        run: python -m pytest server/tests scripts/tests -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install UI dependencies
        run: npm ci --prefix web
      - name: Verify TypeScript and build
        run: npm run build --prefix web
