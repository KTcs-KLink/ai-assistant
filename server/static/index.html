function gradeAndStep(grade, payStep) {
  const rank = String(grade ?? '').trim();
  const step = String(payStep ?? '').trim();
  if (!rank || !step) return rank || step;
  // 기존 인사기록에는 직급과 호봉이 한 값에 함께 저장되기도 한다.
  const suffix = step.startsWith(rank) ? step.slice(rank.length) : step;
  return [rank, suffix.replace(/^[\s·]+/, '')].filter(Boolean).join(' · ');
}

    try {
      await api('/v1/me/learning/' + b.dataset.enroll + '/enroll', {method: 'POST'})
      await loadLearning(); render(); toast('신청했어요. 수강하기를 누르면 바로 강의로 넘어가요.')
    } catch (error) { b.disabled = false; toast(error.message) }
  })
}

async function openMandatory(code) {
  if (page !== 'education') navigate('education')
  try { if (!learning) { await loadLearning(); render() } } catch (error) { toast(error.message); return }
  const m = learning.mandatory.find(x => x.code === code)
  if (!m?.course) { toast('연결된 과정을 찾지 못했어요.'); return }
  if (m.status === 'completed') { toast(`${m.title}은 이미 수료했어요.`); return }
  openPlayer(m.course.id)
}

function findCourse(id) {
  const m = learning?.mandatory.find(x => x.course?.id === id)
  if (m) return {id, title: m.course.title, hours: m.course.hours, format: m.course.format}
  return learning?.recommended.find(c => c.id === id)
}

async function openPlayer(id) {
  const course = findCourse(id)
  if (!course) return
  let enr
  try { enr = await api('/v1/me/learning/' + id + '/enroll', {method: 'POST'}) } catch (error) { toast(error.message); return }
  modal(esc(course.title), `<p class="small muted" style="margin:0 0 12px">${esc(learning.provider)} 강의실 · 시연 화면이에요. 실제로는 ${esc(learning.provider)} 강의 페이지로 바로 넘어가요.</p>
    <div class="player-screen"><span>▶</span><div><strong>${esc(course.title)}</strong><small>${esc(course.format || '온라인')} · ${course.hours}시간</small></div></div>
    <div class="progress-label"><span>진도</span><strong id="player-pct">${enr.progress}%</strong></div>
    <div class="progress"><i id="player-bar" style="width:${enr.progress}%"></i></div>
    <p class="small" id="player-msg" style="margin:12px 0 0">끝까지 들으면 수료가 자동으로 처리돼요. 이수 사실을 따로 입력할 필요가 없어요.</p>
    <div class="modal-actions"><button class="btn" data-action="close">나중에 이어 듣기</button><button class="btn primary" id="player-play">끝까지 듣기 (시연)</button></div>`)
  const play = $('#player-play')
  play.onclick = async () => {
    play.disabled = true
    let pct = enr.progress, res
    try {
      while (pct < 100) {
        pct = Math.min(100, pct + 20)
        res = await api('/v1/me/learning/' + id + '/progress', {method: 'POST', body: JSON.stringify({percent: pct})})
        const bar = $('#player-bar'); if (!bar) return
        bar.style.width = res.progress + '%'; $('#player-pct').textContent = res.progress + '%'
        await new Promise(r => setTimeout(r, 350))
      }
    } catch (error) { play.disabled = false; toast(error.message); return }
    if (res?.status === 'completed') {
      $('#player-msg').innerHTML = `<span class="tag green">수료 완료</span> ${dotDate(res.completed_at.slice(0,10))}에 수료됐어요. 이수 이력과 필수교육 현황에 자동으로 반영했어요.`
      play.remove()
      await refreshLearningEverywhere()
    }
  }
}

async function refreshLearningEverywhere() {
  try {
    const [l, t, card] = await Promise.all([api('/v1/me/learning'), api('/v1/me/training-status'), api('/v1/me/hr-card')])
    learning = l; me.training = t; me.hr = card
    if (page === 'education' || page === 'home') render()
  } catch (error) { toast(error.message) }
}

function saveDraft(quiet=false){record.step=step;record.date=today();let i=db.records.findIndex(r=>r.id===record.id);if(i<0)db.records.unshift(structuredClone(record));else db.records[i]=structuredClone(record);const ok=persist();if(!quiet){render();if(ok)toast('초안을 이 브라우저에 저장했어요.')}return ok}
let ownChanges = null

function changeRequestTitle(item) {
  const fields = Object.keys(item.changes).map(key => contactLabels[key]).filter(Boolean)
  return fields.length ? fields.join('·') + ' 변경' : '인사정보 변경'
}

function changeRequestRow(item) {
  return `<tr><td><strong>${esc(changeRequestTitle(item))}</strong><div class="small muted">인사정보 변경 신청</div></td>
    <td>${esc(dotDate((item.decided_at || item.submitted_at).slice(0,10)))}</td>
    <td>${contactStatus(item.status)}</td><td>${item.status === 'pending' ? '인사 담당자 확인 대기' : '처리 완료'}</td>
    <td><button class="btn" data-own-change="${item.id}">상세 보기</button></td></tr>`
}

function bindOwnChanges() {
  const host = $('#own-changes-status')
  const state = ownChanges
  if (!host || !state) return
  document.querySelectorAll('[data-own-change]').forEach(button => button.onclick = () => {
    const item = state.rows.find(row => String(row.id) === button.dataset.ownChange)
    if (!item) return
    modal(esc(changeRequestTitle(item)), `<p>신청일 ${esc(dotDate(item.submitted_at.slice(0,10)))} · ${contactStatus(item.status)}</p>
      <h3>신청한 내용</h3>${contactSummary(item)}
      ${item.decided_at ? `<p>${item.status === 'cancelled' ? '취소일' : '처리일'} ${esc(dotDate(item.decided_at.slice(0,10)))}</p>` : ''}
      ${item.reason ? `<p>${item.status === 'rejected' ? '반려 사유' : '처리 사유'} · ${esc(item.reason)}</p>` : ''}
      ${item.status === 'pending' ? '<button class="btn" id="cancel-own-change">신청 취소</button>' : ''}
      ${item.status === 'cancelled' ? '<button class="btn" id="new-own-change">다시 신청하기</button>' : ''}`)
    const again = $('#new-own-change')
    if (again) again.onclick = () => { closeModal(); navigate('contact') }
    const cancel = $('#cancel-own-change')
    if (cancel) cancel.onclick = async () => {
      if (!window.confirm('이 변경 신청을 취소할까요?')) return
      cancel.disabled = true
      let message
      try {
        await api('/v1/hr/me/contact-requests/' + item.id + '/cancel', {method:'POST'})
        message = '변경 신청을 취소했어요.'
      } catch (error) {
        if (error.status !== 409) {
          if (cancel.isConnected) { cancel.disabled = false; toast(error.message) }
          return
        }
        message = error.message
      }
      if (ownChanges !== state || !auth.signedIn) return
      if (cancel.isConnected) closeModal()
      ownChanges = null
      render()
      toast(message)
    }
  })
  if (state.error) {
    host.textContent = '인사정보 변경 신청을 불러오지 못했어요. '
    const retry = document.createElement('button')
    retry.className = 'btn'
    retry.textContent = '다시 시도'
    retry.onclick = () => { ownChanges = null; render() }
    host.append(retry)
  }
  if (state.started) return
  state.started = true
  api('/v1/hr/me/contact-requests').then(rows => { state.rows = rows })
    .catch(() => {state.error = true})
    .finally(() => {
      state.loaded = true
      if (ownChanges !== state || page !== 'requests' || !auth.signedIn) return
      const input = $('#record-search')
      const focused = input && document.activeElement === input
      const cursor = focused && input.selectionStart
      render()
      if (focused) { $('#record-search').focus(); $('#record-search').setSelectionRange(cursor,cursor) }
    })
}
function requests(){const state = ownChanges ||= {rows:[],started:false,loaded:false,error:false};
  const statuses = {pending:'제출됨', approved:'승인됨', rejected:'반려됨', cancelled:'취소됨'};
  const changes = state.rows.filter(item => (filter === '전체' || statuses[item.status] === filter)
    && (!search || ('인사정보 변경 신청 ' + changeRequestTitle(item)).includes(search)));
  let rows=db.records.filter(r=>(filter==='전체'||r.status===filter)&&(!search||r.title.includes(search)));return `<div class="page-title"><h1>신청 현황</h1><p>내 서류와 인사정보 변경 신청의 처리 상태를 확인해요.</p></div><div class="tabs">${['전체','작성 중','제출됨','승인됨','반려됨','취소됨'].map(s=>`<button class="tab ${filter===s?'active':''}" data-filter="${s}">${s} <span class="tiny">${db.records.filter(r=>s==='전체'||r.status===s).length + state.rows.filter(item => s==='전체' || statuses[item.status]===s).length}</span></button>`).join('')}</div><div class="toolbar"><input class="search-field" id="record-search" placeholder="신청 이름으로 검색해요" aria-label="내 신청 검색" value="${esc(search)}"><div class="spacer"></div>${btn('새 서류 작성','new-document','primary','file')}</div><div id="own-changes-status" role="status">${state.loaded?'':'인사정보 변경 신청을 불러오는 중이에요.'}</div><div class="card table-wrap">${rows.length || changes.length?`<table class="data-table"><thead><tr><th>신청명</th><th>최종 변경일</th><th>상태</th><th>결재 진행</th><th>다음 행동</th></tr></thead><tbody>${changes.map(changeRequestRow).join('')}${rows.map(r=>`<tr><td><strong>${esc(r.title)}</strong><div class="small muted">${esc(r.values.course||r.values.cert||r.values.subject||esc(me.name+' · '+me.dept))}</div>${r.status==='반려됨'?`<div class="history-reason">${esc(r.reason)}</div>`:''}</td><td>${r.date}</td><td>${badge(r.status)}</td><td>${({'작성 중':'제출 전','제출됨':'결재 대기','승인됨':'결재 완료','반려됨':'반려 처리'})[r.status] || '—'}</td><td>${['작성 중','반려됨'].includes(r.status)?`<button class="btn" data-edit="${r.id}">${r.status==='반려됨'?'수정하기':'이어서 작성'} ${icon('arrow')}</button>`:`<button class="btn" data-record="${r.id}">상세 보기</button>`}<button class="icon-btn" data-pdf-record="${r.id}" aria-label="${r.title} PDF 다운로드">${icon('download')}</button></td></tr>`).join('')}</tbody></table>`:!state.loaded?'':empty('검색 결과가 없어요','다른 검색어나 상태를 선택해 주세요.','clear-filters','필터 초기화')}</div>`}

function question(){return `<div class="page-title"><h1>규정, 쉽게 물어보세요</h1><p>근거를 함께 확인하고, 필요한 다음 행동까지 이어가요.</p></div><div class="qa-layout"><section class="card qa-chat"><div class="flex small muted">${icon('spark')}K-LINK 업무 비서 <span class="tag green">규정 검색 연결됨</span></div>${qa.query?`<div class="qa-query">${esc(qa.query)}</div>`:''}${qaContent()}${askBar('궁금한 내용을 입력해 주세요.')}<p class="disclaimer">사내 규정 18개에서 검색하고, 답변은 찾은 근거만 사용해 작성해요.</p></section><aside class="card source-panel">${qa.phase==='done'&&qa.citations?.length?citeContent(qa.citations[qa.sel||0]):sourceContent(null)}</aside></div>`}
function qaContent(){if(['searching','generating'].includes(qa.phase))return `<div class="loading-wrap"><span class="spinner"></span><p>${qa.phase==='searching'?'관련 규정을 검색하고 있어요…':'근거를 바탕으로 답변을 정리하고 있어요…'}</p>${btn('답변 중지','stop-qa')}</div>`;if(qa.phase==='stopped')return `<div class="qa-message"><h3>답변 생성을 중지했어요.</h3><p>다시 시도하거나 다른 질문을 입력해 주세요.</p>${btn('다시 생성하기','retry-qa')}</div>`;if(qa.phase==='error')return `<div class="qa-message"><h3>지금은 답변을 불러오지 못했어요.</h3><p>잠시 후 다시 시도해 주세요.</p>${btn('다시 시도','retry-qa')}</div>`;if(qa.phase==='none')return `<div class="qa-message"><span class="tag orange">근거 없음</span><h3 style="margin-top:15px">규정에서 찾을 수 없어요.</h3><p>등록된 규정에서 이 질문의 근거를 찾지 못했어요. 인사팀에 확인해 주세요.</p>${qa.rule?`<p class="small muted" style="margin-top:10px">규정 답변과 별개로, 하려는 업무는 바로 시작할 수 있어요.</p>`:''}<div class="qa-actions">${qa.rule?btn(ctaLabel(),'qa-document','primary','arrow'):''}${btn('문의 부서 확인','contact')}${btn('질문 바꾸기','change-question')}</div></div>`;if(qa.phase==='done'){return `<div class="qa-message"><span class="tag green">규정 ${qa.citations.length}건에서 찾았어요</span><div class="qa-answer" style="margin-top:13px;line-height:1.85">${formatAnswer(qa.answer)}</div><div style="margin-top:17px;display:flex;flex-direction:column;gap:6px;align-items:flex-start">${qa.citations.map((c,i)=>`<button class="reference" data-cite="${i}">${icon('book')}[${c.number}] ${esc(c.doc)}${c.article?' '+esc(c.article):''} · ${esc(c.pages)} ${icon('chevron')}</button>`).join('')}</div>${qa.rule?`<div class="qa-actions">${btn(ctaLabel(),'qa-document','primary','arrow')}</div>`:''}</div>`}return `<div class="qa-message" style="margin-top:45px"><span class="quick-icon">${icon('book')}</span><h3 style="margin-top:20px">무엇이 궁금하세요?</h3><p>길고 복잡한 규정에서 필요한 내용을 찾아드려요.<br>아래 예시 질문으로 시작해 보세요.</p><div class="suggestions">${['자격증 따면 승진 가점이 있나요?','해외 위탁교육 받으면 재직의무가 있나요?','외부 위탁교육 교육비는 회사가 내주나요?'].map(q=>`<button data-ask="${q}">${q}</button>`).join('')}</div></div>`}
let qaAbort=null,filling=false,fillReply='',minuting=false,minutesReply='',minutesDraft='';function minutesBox(v){const has=hasValue(v.discussion);return `<form id="minutes-form" class="fill-box" style="margin:0 0 16px"><label class="field-label" for="minutes-text">${has?'회의 내용 다시 넣기':'회의 내용 붙여넣기'}</label><p class="small muted" style="margin:0 0 8px">메모, 녹취록, 화상회의 자막을 그대로 붙여 넣으면 회의록과 요약을 만들어요.</p><textarea class="field" id="minutes-text" rows="${has?3:9}" placeholder="예: 11/18 2시 3층 회의실, 박팀장 김대리 이주임. 교육 예산 10% 줄이기로 함. 김대리가 27일까지 견적 다시 받기.">${esc(minutesDraft)}</textarea><button class="btn ${has?'':'primary'} full" type="submit" ${minuting?'disabled':''}>${minuting?'회의록 만드는 중… (길면 1분 이상 걸려요)':has?'다시 만들기':'회의록 만들기'}</button>${minutesReply?`<p class="small muted" style="margin-top:8px">${esc(minutesReply)}</p>`:''}</form>`}function fillBox(){return `<form id="fill-form" class="fill-box"><label class="field-label" for="fill-text">말로 한 번에 채우기</label><textarea class="field" id="fill-text" rows="3" placeholder="예: 10월 24일에 정보처리기사 땄어요. 승진 가점 받으려고 신고해요."></textarea><button class="btn full" type="submit" ${filling?'disabled':''}>${filling?'채우는 중…':'AI로 채우기'}</button>${fillReply?`<p class="small muted" style="margin-top:8px">${esc(fillReply)}</p>`:''}</form>`}function ctaLabel(){return ({cert:'자격증 등록하기',training:'외부교육 신청하기',service:'외부교육 신청하기',leave:'연차계획 작성하기',mandatory:'교육 신청하기'})[qa.rule]||'서류 작성하기'}function guessRule(q){return /의무|복무|해외/.test(q)?'service':/자격|기사|기능사|정처|컴활|면허|수당|취득|땄|땀|합격/.test(q)?'cert':/교육비|외부\s*(교육|연수)|위탁|연수|신청|교육.*지원|지원.*교육/.test(q)?'training':/괴롭힘|필수교육/.test(q)?'mandatory':/연차/.test(q)?'leave':null}function ask(q){if(!q.trim())return;qaAbort?.abort();const ctrl=new AbortController();qaAbort=ctrl;qa={query:q.trim(),phase:'searching',rule:guessRule(q),answer:'',citations:[],sel:0};page='qa';mode='normal';location.hash='qa';render();clearTimeout(qaTimer);qaTimer=setTimeout(()=>{if(qa.phase==='searching'){qa.phase='generating';render()}},1200);qaApi(qa.query,ctrl.signal).then(d=>{if(qaAbort!==ctrl||qa.phase==='stopped')return;clearTimeout(qaTimer);qa.answer=d.answer;qa.citations=d.citations;qa.limitations=d.limitations;qa.phase=qa.answer&&qa.citations.length?'done':'none';render()}).catch(e=>{if(e.name==='AbortError'||qaAbort!==ctrl||qa.phase==='stopped')return;clearTimeout(qaTimer);qa.phase='error';qa.error=e.message;render()})}let qaConv=null;const auth = {client: null, token: null, demo: false, signedIn: false}

function allowedPage(next) {
  if (next === 'review' || next === 'welfare-review') return me.role === 'admin'
  if (next === 'welfare') return true
  if (next === 'hr') return hrAdmin.allowed
  if (next === 'employment' || next === 'contact') return true
  if (next === 'admin') return me.role === 'admin'
  return ['home', 'card', 'education', 'documents', 'qa', 'requests', 'rules'].includes(next)
}

async function boot() {
  try {
    const response = await fetch('/api/config')
    if (!response.ok) throw new Error('인사 포털 설정을 불러오지 못했어요.')
    const config = await response.json()
    if (!config.auth || !config.supabase_anon_key) {
      return showLogin('회사 계정 로그인 설정을 확인해 주세요.', true)
    }
    if (!window.supabase) throw new Error('로그인 모듈을 불러오지 못했어요.')
    auth.client = window.supabase.createClient(config.supabase_url, config.supabase_anon_key)
    auth.client.auth.onAuthStateChange((_event, session) => { auth.token = session?.access_token || null })
    auth.token = (await auth.client.auth.getSession()).data.session?.access_token || null
    if (!auth.token) return showLogin()
    await openWorkspace(location.hash.slice(1))
  } catch (error) {
    if (error.status === 401) clearLogin()
    showLogin(error.message, !auth.client)
  }
}

async function loadMe() {
  const [user, employee, training, card, portal] = await Promise.all([
    api('/v1/me'), api('/v1/me/employee'), api('/v1/me/training-status'),
    api('/v1/me/hr-card'), api('/v1/hr/me'),
  ])
  const alerts = await api('/v1/me/alerts').catch(() => ({items: []}))
  storageKey = 'klink-demo-v1:' + user.user_id
  db = readDrafts()
  me = {
    ...me, name: user.display_name || employee.display_name,
    role: user.role, dept: employee.department_name || '',
    position: employee.position_title || '', grade: employee.grade || '',
    birth: employee.birth_date || '', employeeNo: employee.employee_no || '',
    jobType: employee.job_type || '', training, hr: card, alerts,
  }
  auth.demo = portal.demo
  hrAdmin.allowed = portal.can_manage
  hrAdmin.asOf = portal.as_of
  return true
}

async function openWorkspace(requested = 'home') {
  await loadMe()
  auth.signedIn = true
  page = allowedPage(requested) ? requested : 'home'
  mode = 'normal'
  history.replaceState(null, '', '#' + page)
  render()
}

function showLogin(message = '', fatal = false) {
  const fields = `
    <label class="small" for="login-email">이메일</label>
    <input id="login-email" type="email" autocomplete="username" required ${fatal ? 'disabled' : ''}>
    <label class="small" for="login-password">비밀번호</label>
    <input id="login-password" type="password" autocomplete="current-password" required ${fatal ? 'disabled' : ''}>
    <button class="btn primary" type="submit" style="width:100%" ${fatal ? 'disabled' : ''}>로그인</button>`
  $('#modal-root').innerHTML = ''
  $('#app').innerHTML = `<main class="login-wrap"><form class="login-card" id="login-form">
    <div class="brand flex" style="margin-bottom:6px"><span class="brand-mark"><i></i><i></i><i></i><i></i></span>K-LINK</div>
    <h1 style="font-size:22px;margin:14px 0 4px">인사 포털 로그인</h1>
    <p class="small muted" style="margin:0 0 18px">회사에서 받은 계정으로 로그인해 주세요.</p>
    ${fields}<p class="login-error" role="alert">${esc(message)}</p></form></main>`
  if (fatal) return
  const form = $('#login-form')
  $('#login-email')?.focus()
  form.onsubmit = async event => {
    event.preventDefault()
    const buttons = [...form.querySelectorAll('button')]
    buttons.forEach(button => { button.disabled = true })
    const errorLine = form.querySelector('.login-error')
    errorLine.textContent = ''
    try {
      const credentials = {email: $('#login-email').value.trim(), password: $('#login-password').value}
      const {data, error} = await auth.client.auth.signInWithPassword(credentials)
      if (error) throw new Error('이메일과 비밀번호를 확인해 주세요.')
      auth.token = data.session.access_token
      await openWorkspace()
    } catch (error) {
      errorLine.textContent = error.message
    } finally {
      buttons.forEach(button => { button.disabled = false })
    }
  }
}

function clearLogin() {
  ownChanges = null
  auth.token = null
  auth.signedIn = false
  qaConv = null
  qaAbort?.abort()
  clearTimeout(qaTimer)
  qa = {query: '', phase: 'idle', rule: 'cert'}
  record = null
  hrTab = 'basic'
  hrAdmin.allowed = false
  hrAdmin.detail = null
  hrAdmin.people = null
}

async function logout() {
  try {
    const {error} = await auth.client.auth.signOut()
    if (error) throw error
  } catch (error) {
    toast(error.message)
    return
  }
  clearLogin()
  history.replaceState(null, '', '/')
  showLogin('로그아웃했어요.')
}

function authHeaders(){return auth.token?{Authorization:'Bearer '+auth.token}:{}}async function api(path,opt={}){const r=await fetch(path,{...opt,headers:{'Content-Type':'application/json',...authHeaders(),...(opt.headers||{})}});const d=r.status===204?null:await r.json().catch(()=>null);if(r.status===401&&auth.token){clearLogin();showLogin('로그인이 만료됐어요. 다시 로그인해 주세요.')}if(!r.ok){const err=new Error(d?.message||'HTTP '+r.status);err.code=d?.code;err.status=r.status;throw err}return d}function wait(ms,signal){return new Promise((ok,no)=>{const t=setTimeout(ok,ms);signal?.addEventListener('abort',()=>{clearTimeout(t);no(new DOMException('중단','AbortError'))},{once:true})})}function uiCitation(c){const l=c.location||{},pages=l.page_start?('p.'+l.page_start+(l.page_end&&l.page_end!==l.page_start?'–'+l.page_end:'')):'';return{id:c.id,number:c.label,doc:c.title,heading:l.article||'',article:l.article||'',pages,text:(c.quotes||[]).join('\n')}}async function qaApi(question,signal,retried){if(!qaConv){const c=await api('/v1/conversations',{method:'POST',signal,body:JSON.stringify({title:question.slice(0,200),client_request_id:crypto.randomUUID()})});qaConv=c.id}let acc;try{acc=await api('/v1/answers',{method:'POST',signal,body:JSON.stringify({conversation_id:qaConv,question,mode:'qa',selected_version_ids:[],client_request_id:crypto.randomUUID()})})}catch(e){if(!retried&&(e.status===404||e.code==='conversation_busy')){qaConv=null;return qaApi(question,signal,true)}throw e}while(true){await wait(2000,signal);const a=await api(acc.status_url,{signal});if((a.phase==='generation'||a.phase==='citation_check')&&qa.phase==='searching'){qa.phase='generating';render()}if(a.status==='failed')throw new Error(a.error?.message||'답변을 만들지 못했어요.');if(a.status==='completed'){const r=a.result;return{answer:r.decision==='answered'&&r.answer?r.answer:'',citations:r.decision==='answered'?r.citations.map(uiCitation):[],limitations:r.limitations||[]}}}}
function formatAnswer(t){return esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/\[(\d+)\]/g,(m,n)=>`<button class="cite-mark" data-cite="${Math.max(0,(qa.citations||[]).findIndex(c=>c.number===Number(n)))}" aria-label="근거 ${n} 보기">[${n}]</button>`).replace(/\n/g,'<br>')}function citeContent(c){return `<span class="tag green">근거 [${c.number}]</span><h3>${esc(c.doc)}</h3><p class="small muted">${esc(c.heading)}</p><div class="quote" style="max-height:420px;overflow:auto"><span class="tiny muted">규정 원문</span><br>${esc(c.text).replace(/\n/g,'<br>')}</div><dl><dt>문서명</dt><dd>${esc(c.doc)}</dd><dt>위치</dt><dd>${esc(c.heading)}</dd><dt>페이지</dt><dd>${esc(c.pages)}</dd>${c.score!=null?`<dt>관련도</dt><dd>${c.score}</dd>`:''}<dt>문의 부서</dt><dd>인사팀</dd></dl>`}
function sourceContent(key){if(!key)return `<span class="tag">근거 패널</span><h3>답변의 출처를 확인해요</h3><p class="small muted">질문하면 관련 조항과 확인 가능한 문서 정보를 함께 표시해요.</p><div class="empty-state" style="padding:55px 15px">${icon('book')}<p>아직 선택된 근거가 없어요.</p></div>`;const r=rules[key];return `<span class="tag green">근거 규정</span><h3>${r.name}</h3><p class="small muted">${r.clause}</p><div class="quote"><span class="tiny muted">규정 원문 발췌</span><br><mark>${r.highlight}</mark><br>${r.summary}</div><dl><dt>문서명</dt><dd>${r.name}</dd><dt>조항</dt><dd>${r.clause}</dd><dt>페이지</dt><dd>${r.page}</dd><dt>개정일</dt><dd>${r.revised}</dd><dt>문의 부서</dt><dd>인사팀</dd></dl><div class="notice warn" style="margin-top:22px">${icon('warning')}아래 요약은 이해를 돕기 위한 설명이에요. 정확한 내용은 규정 원문을 확인해 주세요.</div>`}
function ruleList(){return `<div class="page-title"><h1>사내 규정</h1><p>답변과 서류의 근거를 확인해요. 시연용으로 일부 조항만 등록되어 있어요.</p></div><div class="source-list">${Object.entries(rules).map(([k,r])=>`<article class="card"><span class="tag">${r.page}</span><h3>${r.name} · ${r.clause}</h3><p>${r.summary}</p>${btn('근거 정보 보기','source:'+k,'','book')}</article>`).join('')}</div>`}
function admin(){return `<div class="page-title"><h1>관리자 워크스페이스</h1><p>직원이 제출한 서류를 검토하고, 양식과 규정을 관리해요.</p></div><div class="notice admin-note">${icon('lock')}직원의 작성 중 초안은 표시하지 않아요.</div><div class="tabs">${[['submissions','제출 서류'],['templates','양식 관리'],['regulations','규정 문서 관리']].map(([k,t])=>`<button class="tab ${adminTab===k?'active':''}" data-admin-tab="${k}">${t}</button>`).join('')}</div>${adminTab==='submissions'?adminSubmissions():adminTab==='templates'?adminTemplates():adminRegulations()}`}
function adminSubmissions(){const rows=db.records.filter(r=>r.status!=='작성 중'&&(adminType==='전체'||r.type===adminType)&&(adminStatus==='전체'||r.status===adminStatus)&&(adminDept==='전체'||r.values.dept===adminDept));return `<div class="toolbar"><select id="admin-type" aria-label="서류 종류 필터"><option value="전체">모든 서류</option>${Object.entries(forms).map(([k,d])=>`<option value="${k}" ${adminType===k?'selected':''}>${d.title}</option>`).join('')}</select><select id="admin-status" aria-label="상태 필터">${['전체','제출됨','승인됨','반려됨'].map(s=>`<option ${adminStatus===s?'selected':''}>${s}</option>`).join('')}</select><select id="admin-dept" aria-label="부서 필터">${['전체','정보통신처','경영지원처'].map(s=>`<option ${adminDept===s?'selected':''}>${s}</option>`).join('')}</select><div class="spacer"></div><span class="small muted">${rows.length}건</span></div><div class="card table-wrap">${rows.length?`<table class="data-table"><thead><tr><th>서류명</th><th>신청자 / 부서</th><th>제출일</th><th>상태</th><th>검토</th></tr></thead><tbody>${rows.map(r=>`<tr><td><strong>${r.title}</strong><div class="small muted">${esc(r.values.course||r.values.subject||r.values.cert||'')}</div></td><td>${esc(r.values.name)}<div class="small muted">${esc(r.values.dept)}</div></td><td>${r.date}</td><td>${badge(r.status)}</td><td><button class="btn" data-review="${r.id}">상세 확인 ${icon('chevron')}</button></td></tr>`).join('')}</tbody></table>`:empty('조건에 맞는 제출 서류가 없어요','다른 상태나 부서를 선택해 주세요.','admin-clear','필터 초기화')}</div>`}
function adminTemplates(){return `<div class="card table-wrap"><table class="data-table"><thead><tr><th>양식</th><th>버전</th><th>칸 구성</th><th>관리</th></tr></thead><tbody>${Object.entries(forms).map(([k,d])=>`<tr><td><strong>${d.title}</strong><div class="tiny muted">원본 양식 기반</div></td><td>v${db.templateVersion?.[k]||'1.0'}</td><td>${fieldsFor(k).length}개 항목</td><td><button class="btn" data-template="${k}">구성 편집</button></td></tr>`).join('')}</tbody></table></div>`}

// Export a self-contained image-backed PDF. Canvas text preserves Korean glyphs without an external PDF/font dependency.
async function exportPDF(docs,name){const html=docs.map(doc=>paper(doc.type,doc.values,false,doc.snapshot)).join('<div style="page-break-after:always"></div>');const css=[...document.querySelectorAll('style')].map(x=>x.outerHTML).join('');const f=document.createElement('iframe');f.style.cssText='position:fixed;right:0;bottom:0;width:0;height:0;border:0';document.body.appendChild(f);const w=f.contentWindow,doc=w.document;doc.open();doc.write(`<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>${esc(name||'K-LINK 서류')}</title>${css}<style>@page{size:A4;margin:14mm}body{background:#fff}.paper{box-shadow:none;min-height:0;padding:0}.paper-cell,.paper-cell.auto,.paper-cell.filled,.paper-cell.empty{background:none!important;color:#222!important;box-shadow:none!important}.cell-label{display:none}</style><\/head><body>${html}<\/body><\/html>`);doc.close();setTimeout(()=>{w.focus();w.print();setTimeout(()=>f.remove(),1500)},300);toast('인쇄 창에서 대상을 "PDF로 저장"으로 선택해 주세요.')}

document.addEventListener('keydown',e=>{if(e.key==='Escape'){if($('#modal-root').children.length)closeModal();else if(mobile){mobile=false;render()}}if(e.key==='Tab'&&$('.modal')){const nodes=[...$('.modal').querySelectorAll('button,input,select,textarea,a[href]')].filter(x=>!x.disabled),first=nodes[0],last=nodes[nodes.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last?.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first?.focus()}}});
window.addEventListener('hashchange',()=>{if(!auth.signedIn)return;const next=location.hash.slice(1);if(allowedPage(next)&&next!==page){if(page==='editor'&&record)saveDraft(true);page=next;mode='normal';render();refreshHrCard(next)}});
const hrAdmin = {allowed: false, people: null, detail: null, asOf: ''}

function employeeDirectory() {
  return `<div class="page-title"><h1>직원 관리</h1><p class="muted">직원 기록을 조회하고 연락처 또는 인사발령을 관리해요.</p></div>
    <div id="employee-directory"><p role="status" class="muted">직원 목록을 불러오는 중이에요.</p></div>`
}

function directoryPanel(host) {
  host.innerHTML = `<section class="card" style="padding:18px">
    <label for="employee-search">직원 검색</label>
    <input id="employee-search" class="input" placeholder="이름, 사번, 소속, 직급" style="display:block;margin:8px 0 14px;width:min(100%,340px);padding:9px">
    <div id="employee-results"></div></section>`
  const search = $('#employee-search')
  function showRows() {
    const term = search.value.trim().toLowerCase()
    const rows = hrAdmin.people.filter(person => [person.name, person.employee_no, person.department, person.grade]
      .some(item => String(item || '').toLowerCase().includes(term)))
    $('#employee-results').innerHTML = hrTable(['이름', '사번', '소속', '직위', '직급', '입사일'], rows.map(person => [
      `<button class="text-btn" data-employee="${esc(person.employee_no)}">${esc(person.name)}</button>`,
      esc(person.employee_no), esc(person.department), esc(person.position), esc(person.grade), esc(person.hired_on),
    ]), '검색 결과가 없어요.')
    host.querySelectorAll('[data-employee]').forEach(button => button.onclick = async () => {
      button.disabled = true
      try {
        const profile = await api('/v1/hr/employees/' + encodeURIComponent(button.dataset.employee))
        if (!host.isConnected) return
        hrAdmin.detail = profile
        detailPanel(host)
      } catch (error) { toast(error.message) }
      finally { button.disabled = false }
    })
  }
  search.addEventListener('input', showRows)
  showRows()
}

function detailPanel(host) {
  const profile = hrAdmin.detail
  const base = profile.basic
  const personal = profile.personal || {}
  const field = (label, name, value, type = 'text', extra = '') =>
    `<label style="display:grid;gap:4px">${label}<input class="input" style="padding:8px;width:100%" name="${name}" type="${type}" value="${esc(value || '')}" ${extra}></label>`
  const form = (id, title, contents, action) => `<form id="${id}" class="card" style="padding:18px;margin-bottom:16px">
    <h2 style="margin-top:0">${title}</h2><div style="display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(175px,100%),1fr))">${contents}</div>
    <p role="alert" class="login-error"></p><button class="btn primary" type="submit">${action}</button></form>`
  host.innerHTML = `<section class="card" style="padding:18px;margin-bottom:16px">
    <div class="section-head"><h2>${esc(base.name)} <span class="muted">${esc(base.employee_no)}</span></h2>
    <button class="text-btn" id="employees-back">직원 목록</button></div>
    ${hrDl([['소속',base.department],['직위',base.position],['직급',base.grade],['입사일',base.hired_on]])}</section>
    ${form('employee-contact', '연락처 관리', field('휴대전화','phone',personal.phone,'tel','maxlength="40"') +
      field('이메일','email',personal.email,'email','maxlength="160"') + field('주소','address',personal.address,'text','maxlength="240"'), '연락처 저장')}
    <section class="card" style="padding:18px;margin-bottom:16px"><h2>인사발령 이력</h2>
    ${hrTable(['적용일','구분','이전 소속','새 소속','직위·직급','상태','메모'], profile.appointments.map(item => [
      dotDate(item.date),esc(item.type),esc(item.before_department || '—'),esc(item.dept),
      esc([item.position,item.grade].filter(Boolean).join(' · ')),esc(item.status),esc(item.note || '—'),
    ]), '등록된 발령이 없어요.')}</section>
    ${form('employee-appointment', '인사발령 등록',
      field('적용일','effective_on',hrAdmin.asOf,'date',`required min="${esc(hrAdmin.asOf)}"`) +
      '<label style="display:grid;gap:4px">발령 구분<select name="kind"><option>부서 이동</option><option>승진</option><option>보직 변경</option></select></label>' +
      field('새 소속','department',base.department,'text','required maxlength="80"') +
      field('새 직위','position',base.position,'text','required maxlength="80"') +
      field('새 직급','grade',base.grade,'text','required maxlength="40"') +
      field('인사팀 메모','note','','text','maxlength="400"'), '발령 등록')}`
  $('#employees-back').onclick = () => {
    hrAdmin.detail = null
    bindEmployeeDirectory()
  }
  for (const [id, method, path, message] of [
    ['employee-contact','PATCH','contact','연락처를 저장했어요.'],
    ['employee-appointment','POST','appointments','발령을 등록했어요.'],
  ]) {
    const section = $('#' + id)
    section.onsubmit = async event => {
      event.preventDefault()
      const button = section.querySelector('button')
      const errorLine = section.querySelector('[role="alert"]')
      button.disabled = true
      errorLine.textContent = ''
      try {
        const updated = await api('/v1/hr/employees/' + encodeURIComponent(base.employee_no) + '/' + path, {
          method, body: JSON.stringify(Object.fromEntries(new FormData(section))),
        })
        if (base.employee_no === me.employeeNo) await loadMe()
        if (host.isConnected && section.isConnected) {
          hrAdmin.detail = updated
          detailPanel(host)
        }
        toast(message)
      } catch (error) { errorLine.textContent = error.message }
      finally { button.disabled = false }
    }
  }
}

async function bindEmployeeDirectory() {
  const host = $('#employee-directory')
  if (!host || !hrAdmin.allowed) return
  if (hrAdmin.detail) return detailPanel(host)
  try {
    hrAdmin.people = await api('/v1/hr/employees')
    if (host.isConnected) directoryPanel(host)
  } catch (error) {
    if (host.isConnected) host.innerHTML = `<p role="alert">${esc(error.message)}</p>`
  }
}

        <section class="card ehr-panel">

function alertCmd(a) {
  return a.action?.kind === 'form' ? 'start:' + a.action.target : 'card-tab:' + (a.action?.target || 'basic')
}

function homeTasks() {
  const edu = todos().map(t => ({title: t.title, due: t.due,
    cmd: t.code === 'unknown' ? 'contact' : 'mandatory:' + t.code, label: '확인'}))
  const alerts = (me.alerts?.items || []).map(a => ({title: a.title, detail: a.detail, due: a.due,
    cmd: alertCmd(a), label: a.action?.label}))
  return [...edu, ...alerts]
}

function mandatorySummary() {
  const t = me.training
  if (!t?.has_history) return '이력 확인 필요'
  const done = t.items.filter(i => i.status === 'completed').length
  return `${done}/${t.items.length} 이수`
}

function ehrRows(rows) {
  return rows.map(([k, v]) => `<div class="ehr-row"><span>${k}</span><strong>${esc(v || '—')}</strong></div>`).join('')
}

function careerCard() {
  const h = me.hr || {}, b = h.basic || {}, lp = lastPromotion(h), a = (h.appointments || [])[0]
  const promo = (me.training?.items || []).find(i => i.code === 'promotion')
  const rows = [
    ['근속기간', b.hired_on ? `${since(b.hired_on)} (${dotDate(b.hired_on)} 입사)` : ''],
    ['현 직급', lp ? `${b.grade || lp.grade} · ${dotDate(lp.date)} 승진 · ${since(lp.date)} 경과` : b.grade],
    ['최근 발령', a ? `${dotDate(a.date)} ${a.type} · ${a.dept}` : ''],
  ]
  if (promo) rows.push(['승진 필수교육', promo.status === 'completed' ? '이수' : '미이수'])
  return `<section class="card ehr-panel"><div class="section-head"><h2>재직 현황</h2>
    <button class="text-btn" data-action="nav-appointments">발령 이력 보기</button></div>${ehrRows(rows)}</section>`
}

function allowanceCard() {
  const h = me.hr || {}
  const deps = (h.family || []).filter(f => f.dependent)
  const paid = (h.certificates || []).filter(c => c.allowance === '반영')
  return `<section class="card ehr-panel"><div class="section-head"><h2>수당 현황</h2>
    <button class="text-btn" data-action="nav-card">인사카드</button></div>
    ${ehrRows([
      ['가족수당', deps.length ? `대상 ${deps.length}명 (${deps.map(f => f.relation).join(', ')})` : '대상 없음'],
      ['기술정보수당', paid.length ? paid.map(c => c.name).join(', ') + ' 반영' : '반영된 자격 없음'],
    ])}
    <p class="small muted" style="margin:10px 0 0">지급액은 급여명세서에서 확인해요.</p></section>`
}

function fmtDays(n) { return Number.isInteger(+n) ? String(+n) : (+n).toFixed(1) }

function bindHomeExtras() {
  const leave = $('#home-leave'), detail = $('#home-leave-detail'), notices = $('#home-notices')
  api('/v1/me/leave').then(l => {
    if (!leave?.isConnected) return
    if (!l.source) { leave.textContent = '확인 필요'; return }
    leave.textContent = `${fmtDays(l.remaining_days)}일 남음`
    detail.textContent = `${fmtDays(l.granted_days)}일 중 ${fmtDays(l.used_days)}일 사용 · ${dotDate(l.period_end)}까지`
  }).catch(() => { if (leave?.isConnected) leave.textContent = '조회하지 못했어요' })
  api('/v1/notices').then(items => {
    if (!notices?.isConnected) return
    notices.innerHTML = items.length ? items.map(n => `<div class="ehr-notice"><span class="tag">${esc(n.category)}</span>
      <span class="ehr-notice-title">${esc(n.title)}</span><time>${dotDate(n.date)}</time></div>`).join('')
      : '<p class="muted">새 공지가 없어요.</p>'
  }).catch(() => { if (notices?.isConnected) notices.innerHTML = '<p class="muted">공지를 불러오지 못했어요.</p>' })
}

const contactLabels = {phone: '휴대전화', email: '이메일', address: '주소'}
function contactSummary(item) {
  return Object.entries(item.changes).map(([key, value]) => `<p>${esc(contactLabels[key])} ${esc(value || '미등록')}</p>`).join('')
}
function contactStatus(status) {
  const label = {pending: '처리 대기', approved: '승인', rejected: '반려', cancelled: '취소됨'}[status] || status
  return `<span class="tag ${status === 'approved' ? 'green' : status === 'rejected' ? 'red' : ''}">${esc(label)}</span>`
}

function serviceHeading(title, description) {
  return `<button class="hr-service-back" data-nav="card">‹ 나의 인사카드</button>
    <div class="page-title"><h1>${title}</h1><p>${description}</p></div>`
}

function contactPage() {
  return `<div class="hr-service">${serviceHeading('인사정보 변경 신청','바꿀 항목만 수정하세요. 승인되면 인사카드에 반영됩니다.')}
    <div id="contact-panel" aria-live="polite">신청 내역을 불러오는 중입니다.</div></div>`
}

async function bindContactPage() {
  const host = $('#contact-panel')
  try {
    const requests = await api('/v1/hr/me/contact-requests')
    if (!host.isConnected) return
    const pending = requests.some(item => item.status === 'pending')
    const personal = me.hr?.personal || {}
    const fields = [['phone','tel',40],['email','email',160],['address','text',240]]
    host.innerHTML = `<form id="contact-request" class="card hr-service-form">
      ${pending ? '<p class="muted">처리 중인 신청이 있어요. 아래에서 상태를 확인할 수 있어요.</p>' : `
        <div>${fields.map(([name,type,length]) =>
          `<label class="service-row"><span>${contactLabels[name]}</span><input class="input" type="${type}" name="${name}" maxlength="${length}" value="${esc(personal[name] || '')}"></label>`).join('')}</div>
        <p role="alert" class="login-error"></p><div class="service-actions"><button type="submit" class="btn primary">변경 신청</button></div>`}
      </form>
      <section class="service-history"><h2>변경 신청 내역</h2>
      ${requests.length ? hrTable(['신청일','변경 내용','상태','처리일','처리 사유'], requests.map(item => [
        dotDate(item.submitted_at.slice(0,10)),contactSummary(item),contactStatus(item.status),
        item.decided_at ? dotDate(item.decided_at.slice(0,10)) : '—',esc(item.reason || '—'),
      ])) : '<p class="service-empty">변경 신청 내역이 없습니다.</p>'}</section>`
    if (pending) return
    const form = $('#contact-request')
    form.onsubmit = async event => {
      event.preventDefault()
      const button = form.querySelector('button')
      button.disabled = true
      try {
        await api('/v1/hr/me/contact-requests', {method:'POST', body:JSON.stringify(Object.fromEntries([...new FormData(form)].filter(([key,value]) => value.trim() !== (personal[key] || ''))))})
        if (form.isConnected) await bindContactPage()
        toast('인사정보 변경을 신청했어요.')
      } catch (error) { form.querySelector('[role="alert"]').textContent = error.message }
      finally { button.disabled = false }
    }
  } catch (error) {
    if (host.isConnected) host.textContent = error.message
  }
}

function reviewPage() {
  return `<div class="page-title"><h1>인사정보 변경 심사</h1><p class="muted">승인한 변경 내용은 직원 인사카드에 반영돼요.</p></div>
    <div id="contact-review-panel" aria-live="polite"><p class="muted">변경 신청을 불러오는 중이에요.</p></div>`
}

async function bindReviewPage() {
  const host = $('#contact-review-panel')
  try {
    const queue = await api('/v1/hr/contact-requests')
    if (!host.isConnected) return
    const pending = queue.filter(item => item.status === 'pending')
    host.innerHTML = `<section class="card ehr-panel"><div class="section-head"><h2>처리 대기 <span class="count">${pending.length}</span></h2></div>
      ${pending.map(item => `<form class="ehr-review" data-contact-review="${item.id}">
        <div><h3>${esc(item.employee_name)} <small>${esc(item.employee)}</small></h3>${contactSummary(item)}</div>
        <label>처리 사유<input class="input" name="reason" maxlength="400" placeholder="반려할 때 필수"></label>
        <div class="ehr-links"><button type="submit" class="btn primary" value="approved">승인</button>
        <button type="submit" class="btn" value="rejected">반려</button></div>
        <p role="alert" class="login-error"></p></form>`).join('') || '<p class="muted">처리할 신청이 없어요.</p>'}</section>
      <section class="card ehr-panel"><div class="section-head"><h2>처리 이력</h2></div>
      ${hrTable(['직원','변경 내용','상태','처리일','처리 사유'], queue.filter(item => item.status !== 'pending').map(item => [
        esc(item.employee_name),contactSummary(item),contactStatus(item.status),
        dotDate(item.decided_at.slice(0,10)),esc(item.reason || '—'),
      ]), '처리 이력이 없어요.')}</section>`
    host.querySelectorAll('form').forEach(form => form.onsubmit = async event => {
      event.preventDefault()
      const decision = event.submitter.value
      const reason = form.elements.reason.value.trim()
      const buttons = [...form.querySelectorAll('button')]
      buttons.forEach(button => { button.disabled = true })
      try {
        await api('/v1/hr/contact-requests/' + form.dataset.contactReview + '/decision', {
          method:'POST', body:JSON.stringify({decision, reason}),
        })
        if (form.isConnected) await bindReviewPage()
        toast(decision === 'approved' ? '변경 신청을 승인했어요.' : '변경 신청을 반려했어요.')
      } catch (error) { form.querySelector('[role="alert"]').textContent = error.message }
      finally { buttons.forEach(button => { button.disabled = false }) }
    })
  } catch (error) {
    if (host.isConnected) host.textContent = error.message
  }
}


// ── 복리후생 신청 (출산축하금·학자금·경조휴가) ─────────────────────────
const WELFARE_KINDS = [
  ['birth', '출산축하금', '둘째 200만원 · 셋째 이상 300만원'],
  ['tuition', '학자금', '고교 지급 · 대학 무이자 대부'],
  ['condolence', '경조휴가', '결혼·출산·사망 등 유급휴가'],
]
const CONDOLENCE_REASONS = [
  ['own_wedding','본인 결혼',5],['child_wedding','자녀 결혼',1],['spouse_birth','배우자 출산',20],
  ['spouse_death','배우자 사망',5],['parent_death','본인 및 배우자의 부모 사망',5],
  ['grandparent_death','본인 및 배우자의 조부모·외조부모 사망',3],['child_death','자녀와 그 자녀의 배우자 사망',3],
  ['sibling_death','본인 및 배우자의 형제자매 사망',3],['adoption','자녀 입양',20],
]
const TUITION_FEES = ['입학금','수업료','육성회비','학생회비','실험실습비']
let welfareKind = 'birth', welfareResult = null

function welfareChildren() { return (me.hr?.family || []).filter(f => f.relation === '자녀') }

function welfareFields(kind) {
  const kids = `<datalist id="welfare-kids">${welfareChildren().map(c => `<option value="${esc(c.name)}">`).join('')}</datalist>`
  const row = (label, input, hint='') => `<label class="service-row"><span>${label}</span><div>${input}${hint ? `<small class="muted welfare-hint">${hint}</small>` : ''}</div></label>`
  if (kind === 'birth') return kids +
    row('자녀 이름', '<input name="child_name" list="welfare-kids" maxlength="40" required>', '가족사항에 이미 등록했다면 목록에서 고르세요.') +
    row('출생일', '<input type="date" name="birth_date" required>') +
    row('출생 자녀 수', '<select name="count"><option value="1">1명</option><option value="2">2명 (쌍둥이)</option><option value="3">3명</option></select>')
  if (kind === 'tuition') return kids +
    row('자녀 이름', '<input name="child_name" list="welfare-kids" maxlength="40" required>') +
    row('학교 구분', '<select name="level"><option value="high">고등학교</option><option value="univ">대학교</option><option value="overseas">해외대학교</option></select>') +
    row('학교명', '<input name="school" maxlength="80" required>') +
    row('학기', '<input name="term" maxlength="20" placeholder="예: 2027-1학기" required>') +
    `<div class="service-row"><span>등록금 항목</span><div class="welfare-fees">${TUITION_FEES.map(f =>
      `<label>${f}<input type="number" min="0" step="1000" name="fee:${f}" placeholder="0"></label>`).join('')}
      <label>그 밖의 비용<input type="number" min="0" step="1000" name="other_fees" placeholder="기숙사비 등"></label></div></div>` +
    '<p class="small muted" style="margin:8px 0 0">해외대학교는 금액을 달러로 입력하세요.</p>'
  return row('사유', `<select name="reason">${CONDOLENCE_REASONS.map(([v,t,d]) => `<option value="${v}" data-days="${d}">${t} (${d}일)</option>`).join('')}</select>`) +
    row('경조사 발생일', '<input type="date" name="event_date" required>', '배우자 출산은 출산(예정)일') +
    row('휴가 시작일', '<input type="date" name="start_date" required>') +
    row('휴가 일수', '<input type="number" name="days" min="1" max="30" value="5" required>', '토·일은 빼고 세요.') +
    row('추가 조건', `<div class="welfare-checks"><label><input type="checkbox" name="twins"> 한 번에 둘 이상 출산</label>
      <label><input type="checkbox" name="remote"> 원격지 (왕복 8시간 이상)</label></div>`)
}

function welfareData(form) {
  const fd = new FormData(form), data = {}
  if (welfareKind === 'tuition') {
    data.fees = {}
    for (const [k, v] of fd) {
      if (k.startsWith('fee:')) { if (v) data.fees[k.slice(4)] = +v }
      else if (k === 'other_fees') data.other_fees = +v || 0
      else data[k] = v.trim()
    }
    return data
  }
  for (const [k, v] of fd) data[k] = typeof v === 'string' ? v.trim() : v
  if (welfareKind === 'birth') data.count = +data.count
  if (welfareKind === 'condolence') { data.days = +data.days; data.twins = fd.has('twins'); data.remote = fd.has('remote') }
  return data
}

const VERDICT = {ok: ['green','요건 충족'], check: ['orange','담당자 확인 필요'], fail: ['red','요건 미충족']}
const CHECK_MARK = {ok: '✓', warn: '!', fail: '✕', info: 'i'}

function welfareReviewView(r, compact = false) {
  const [tone, label] = VERDICT[r.verdict]
  return `<div class="welfare-review ${r.verdict}">
    <div class="welfare-review-head"><span class="tag ${tone}">AI 자동 심사 · ${label}</span><small class="muted">${dotDate(r.reviewed_on)} 기준</small></div>
    <h3>${esc(r.headline || r.title)}</h3>
    <p class="muted" style="margin:0 0 10px">${esc(r.pay_type || '')}${r.pay_type ? ' · ' : ''}${esc(r.summary)}</p>
    <ul class="welfare-checks-list">${r.checks.map(c => `<li class="${c.level}"><b aria-hidden="true">${CHECK_MARK[c.level]}</b>${esc(c.text)}</li>`).join('')}</ul>
    ${compact ? '' : `<p class="small" style="margin:12px 0 4px"><strong>제출 서류</strong> · ${esc(r.documents.join(', '))}</p>`}
    <details class="welfare-basis" ${compact ? '' : 'open'}><summary>근거 규정 ${r.basis.length}건</summary>
      ${r.basis.map(b => `<div><strong>${esc(b.doc)} ${esc(b.article)}</strong> <span class="muted">${esc(b.page)}</span>${b.quote ? `<p>“${esc(b.quote)}”</p>` : ''}</div>`).join('')}</details>
  </div>`
}

function welfarePage() {
  return `<div class="page-title"><h1>복리후생 신청</h1><p>규정과 내 인사기록을 대조해 지급액·휴가일수와 확인할 점을 바로 알려드려요.</p></div>
    <div class="welfare-kinds" role="tablist">${WELFARE_KINDS.map(([k,t,d]) =>
      `<button class="card welfare-kind ${welfareKind===k?'active':''}" role="tab" aria-selected="${welfareKind===k}" data-welfare-kind="${k}"><strong>${t}</strong><small>${d}</small></button>`).join('')}</div>
    <div class="welfare-layout">
      <form class="card hr-service-form" id="welfare-form" novalidate>${welfareFields(welfareKind)}
        <p role="alert" class="login-error"></p>
        <div class="service-actions"><button class="btn" type="submit" value="review">자동 심사</button>
        <button class="btn primary" type="submit" value="submit">신청하기</button></div></form>
      <aside id="welfare-result">${welfareResult ? welfareReviewView(welfareResult) :
        `<div class="card welfare-empty"><p><strong>입력하고 자동 심사를 눌러 보세요.</strong></p><p class="muted small">지급액, 휴가 기간, 대상 여부, 필요한 서류를 근거 조항과 함께 보여드려요. 인사 담당자도 같은 결과를 보고 승인해요.</p></div>`}</aside>
    </div>
    <section class="service-history"><h2>내 복리후생 신청</h2><div id="welfare-history" aria-live="polite"><p class="muted">불러오는 중이에요.</p></div></section>`
}

async function bindWelfarePage() {
  document.querySelectorAll('[data-welfare-kind]').forEach(b => b.onclick = () => {
    welfareKind = b.dataset.welfareKind; welfareResult = null; render()
  })
  const form = $('#welfare-form')
  if (!form) return
  const reason = form.elements.reason
  if (reason) reason.onchange = () => { form.elements.days.value = reason.selectedOptions[0].dataset.days }
  form.onsubmit = async event => {
    event.preventDefault()
    const alert = form.querySelector('[role="alert"]')
    const missing = [...form.querySelectorAll('[required]')].find(el => !el.value.trim())
    if (missing) { alert.textContent = '빈 칸을 채워 주세요.'; missing.focus(); return }
    alert.textContent = ''
    const body = JSON.stringify({kind: welfareKind, data: welfareData(form)})
    const buttons = [...form.querySelectorAll('button')]
    buttons.forEach(b => { b.disabled = true })
    try {
      if (event.submitter?.value === 'submit') {
        const preview = await api('/v1/welfare/review', {method:'POST', body})
        if (preview.verdict === 'fail' && !window.confirm('규정 요건을 충족하지 못한 항목이 있어요. 그래도 신청할까요? (반려될 수 있어요)')) {
          welfareResult = preview; $('#welfare-result').innerHTML = welfareReviewView(preview); return
        }
        const saved = await api('/v1/welfare/requests', {method:'POST', body})
        welfareResult = null
        if (form.isConnected) { render(); toast(`${saved.title} 신청을 접수했어요. 인사 담당자가 확인해요.`) }
      } else {
        welfareResult = await api('/v1/welfare/review', {method:'POST', body})
        if (form.isConnected) $('#welfare-result').innerHTML = welfareReviewView(welfareResult)
      }
    } catch (error) { alert.textContent = error.message }
    finally { buttons.forEach(b => { b.disabled = false }) }
  }
  const host = $('#welfare-history')
  try {
    const rows = await api('/v1/welfare/requests')
    if (!host.isConnected) return
    host.innerHTML = hrTable(['신청일','구분','내용','AI 심사','상태',''], rows.map(r => [
      dotDate(r.submitted_at.slice(0,10)), esc(r.title), esc(r.review.headline || ''),
      `<span class="tag ${VERDICT[r.review.verdict][0]}">${VERDICT[r.review.verdict][1]}</span>`,
      contactStatus(r.status) + (r.reason ? `<div class="small muted">${esc(r.reason)}</div>` : ''),
      r.status === 'pending' ? `<button class="btn" data-welfare-cancel="${r.id}">취소</button>` : '',
    ]), '아직 신청한 내역이 없어요')
    host.querySelectorAll('[data-welfare-cancel]').forEach(b => b.onclick = async () => {
      if (!window.confirm('이 신청을 취소할까요?')) return
      try { await api('/v1/welfare/requests/' + b.dataset.welfareCancel + '/cancel', {method:'POST'}); toast('신청을 취소했어요.') }
      catch (error) { toast(error.message) }
      if (host.isConnected) bindWelfarePage()
    })
  } catch (error) { if (host.isConnected) host.textContent = error.message }
}

function welfareReviewPage() {
  return `<div class="page-title"><h1>복리후생 심사</h1><p class="muted">AI가 규정과 인사기록을 대조한 결과예요. 확인 필요 항목만 보고 승인하거나 반려하세요.</p></div>
    <div id="welfare-queue" aria-live="polite"><p class="muted">신청을 불러오는 중이에요.</p></div>`
}

async function bindWelfareReview() {
  const host = $('#welfare-queue')
  try {
    const rows = await api('/v1/admin/welfare')
    if (!host.isConnected) return
    const pending = rows.filter(r => r.status === 'pending')
    const counts = Object.fromEntries(['ok','check','fail'].map(v => [v, pending.filter(r => r.review.verdict === v).length]))
    host.innerHTML = `<section class="card ehr-panel"><div class="section-head"><h2>처리 대기 <span class="count">${pending.length}</span></h2>
        <p class="small muted" style="margin:0">요건 충족 ${counts.ok} · 확인 필요 ${counts.check} · 요건 미충족 ${counts.fail}</p></div>
      ${pending.map(r => `<form class="welfare-queue-item" data-welfare-decide="${r.id}">
        <div class="welfare-queue-who"><strong>${esc(r.employee_name)}</strong> <small class="muted">${esc(r.employee || '')} · ${esc(r.title)} · ${dotDate(r.submitted_at.slice(0,10))} 신청</small></div>
        ${welfareReviewView(r.review, true)}
        <label class="welfare-reason">처리 사유<input class="input" name="reason" maxlength="400" placeholder="반려할 때 필수"></label>
        <div class="ehr-links"><button type="submit" class="btn primary" value="approved">승인</button>
        <button type="submit" class="btn" value="rejected">반려</button></div><p role="alert" class="login-error"></p></form>`).join('')
        || '<p class="muted">처리할 신청이 없어요.</p>'}</section>
      <section class="card ehr-panel"><div class="section-head"><h2>처리 이력</h2></div>
      ${hrTable(['직원','구분','내용','AI 심사','결과','처리일'], rows.filter(r => r.status !== 'pending').map(r => [
        esc(r.employee_name), esc(r.title), esc(r.review.headline || ''),
        `<span class="tag ${VERDICT[r.review.verdict][0]}">${VERDICT[r.review.verdict][1]}</span>`,
        contactStatus(r.status) + (r.reason ? `<div class="small muted">${esc(r.reason)}</div>` : ''),
        r.decided_at ? dotDate(r.decided_at.slice(0,10)) : '—']), '처리 이력이 없어요.')}</section>`
    host.querySelectorAll('[data-welfare-decide]').forEach(form => form.onsubmit = async event => {
      event.preventDefault()
      const decision = event.submitter.value, reason = form.elements.reason.value.trim()
      if (decision === 'rejected' && !reason) { form.querySelector('[role="alert"]').textContent = '반려 사유를 입력해 주세요.'; return }
      const buttons = [...form.querySelectorAll('button')]
      buttons.forEach(b => { b.disabled = true })
      try {
        await api('/v1/admin/welfare/' + form.dataset.welfareDecide + '/decision', {method:'POST', body: JSON.stringify({decision, reason})})
        toast(decision === 'approved' ? '승인했어요.' : '반려했어요.')
        if (form.isConnected) await bindWelfareReview()
      } catch (error) { form.querySelector('[role="alert"]').textContent = error.message }
      finally { buttons.forEach(b => { b.disabled = false }) }
    })
  } catch (error) { if (host.isConnected) host.textContent = error.message }
}

const certificateApi = '/v1/me/employment-certificates'
function certificatePage() {
  return `<div class="hr-service">${serviceHeading('재직증명서 발급','제출처와 용도를 입력한 뒤, 미리보기에서 내용을 확인하고 PDF로 발급하세요.')}
    <form class="card hr-service-form" id="certificate-form">
      <label class="service-row"><span>제출처</span><input name="recipient" placeholder="예: 제출할 기관명" maxlength="80" required></label>
      <label class="service-row"><span>용도</span><input name="purpose" placeholder="예: 금융기관 제출" maxlength="120" required></label>
      <div class="service-actions"><button class="btn primary" type="submit">미리보기</button></div>
      <div id="certificate-preview"></div><p class="login-error" role="alert"></p></form>
    <section class="service-history"><h2>내 발급 내역</h2><div id="certificate-history" aria-live="polite"></div></section></div>`
}

async function downloadCertificate(number) {
  const res = await fetch(certificateApi + '/' + encodeURIComponent(number) + '/pdf', {headers:authHeaders()})
  if (!res.ok) throw new Error('PDF를 내려받을 수 없어요. 다시 로그인한 후 내 발급 내역을 확인해 주세요.')
  const url = URL.createObjectURL(await res.blob())
  const link = document.createElement('a')
  link.href = url
  link.download = '재직증명서_' + number + '.pdf'
  document.body.append(link)
  link.click()
  link.remove()
  setTimeout(() => URL.revokeObjectURL(url), 60000)
}

function bindCertificatePage() {
  const form = $('#certificate-form'), history = $('#certificate-history')
  const preview = form.querySelector('#certificate-preview'), error = form.querySelector('[role=alert]')
  let generation = 0
  async function loadHistory() {
    try {
      const rows = await api(certificateApi)
      history.innerHTML = rows.length ? hrTable(['발급일','문서번호','제출처','용도','파일'],rows.map(r => [
        esc(r.issued_at.slice(0,10)),esc(r.number),esc(r.recipient),esc(r.purpose),
        `<button class="btn" data-download="${esc(r.number)}">PDF 다운로드</button>`
      ])) : '<p class="service-empty">발급한 재직증명서가 없습니다.</p>'
    } catch (e) { history.textContent = e.message }
  }
  history.onclick = async event => {
    const button = event.target.closest('[data-download]')
    if (button) try { await downloadCertificate(button.dataset.download) } catch(e) {error.textContent=e.message}
  }
  loadHistory()
  form.oninput = () => {generation++; preview.replaceChildren(); error.textContent=''}
  form.onsubmit = async event => {
    event.preventDefault()
    const attempt = ++generation
    preview.replaceChildren()
    error.textContent = ''
    const body = JSON.stringify({...Object.fromEntries(new FormData(form)),request_id:crypto.randomUUID()})
    try {
      const data = await api(certificateApi+'/preview',{method:'POST',body})
      if (generation !== attempt || !form.isConnected) return
      preview.innerHTML = '<iframe title="재직증명서 미리보기" sandbox></iframe><div class="service-actions"><button class="btn primary" type="button">발급 및 PDF 다운로드</button></div>'
      preview.querySelector('iframe').srcdoc = data.html
      const issue = preview.querySelector('button')
      issue.onclick = async () => {
        const controls = [...form.querySelectorAll('button,input')]
        controls.forEach(el => el.disabled=true)
        try {
          const result = await api(certificateApi,{method:'POST',body})
          if (!form.isConnected) return
          preview.replaceChildren()
          form.reset()
          await loadHistory()
          await downloadCertificate(result.number)
        } catch(e) {error.textContent=e.message}
        finally {controls.forEach(el => el.disabled=false)}
      }
    } catch(e) {error.textContent=e.message}
  }
}

async function bindHomeRequests() {
  const count = $('#home-request-count')
  const latest = $('#home-request-latest')
  try {
    const changes = await api('/v1/hr/me/contact-requests')
    if (!count.isConnected) return
    const labels = {pending:'처리 대기', approved:'승인', rejected:'반려', cancelled:'취소됨'}
    const items = changes.map(item => ({
      title:changeRequestTitle(item), status:labels[item.status],
      date:item.decided_at || item.submitted_at, pending:item.status === 'pending'
    }))
    for (const doc of db.records) {
      if (doc.status === '작성 중') continue
      items.push({title:doc.title, status:doc.status, date:(doc.date || '').replaceAll('.', '-'),
        pending:doc.status === '제출됨'})
    }
    items.sort((a,b) => b.date.localeCompare(a.date))
    count.textContent = items.length ? '처리 대기 ' + items.filter(item => item.pending).length + '건' : '신청 내역 없음'
    if (items.length) latest.textContent = '최근 · ' + items[0].title + ' · ' + items[0].status
  } catch {
    if (count.isConnected) count.textContent = '조회하지 못했어요'
  }
}

function bindHrPage() {
  const load = {home: () => { bindHomeRequests(); bindHomeExtras() }, requests: bindOwnChanges, employment: bindCertificatePage, hr: bindEmployeeDirectory, contact: bindContactPage, education: bindLearning, review: bindReviewPage, welfare: bindWelfarePage, 'welfare-review': bindWelfareReview}[page]
  if (mode === 'normal' && load) load()
}

async function refreshHrCard(target) {
  if (target !== 'home' && target !== 'card' && target !== 'contact') return
  const token = auth.token
  try {
    const current = await api('/v1/me/hr-card')
    if (!auth.signedIn || token !== auth.token || page !== target || mode !== 'normal') return
    if (JSON.stringify(me.hr) === JSON.stringify(current)) return
    me.hr = current
    me.dept = current.basic.department || ''
    me.position = current.basic.position || ''
    me.grade = current.basic.grade || ''
    render()
  } catch (error) {
    if (auth.signedIn) toast(error.message)
  }
}
